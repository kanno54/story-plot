ep9:
  title: 奏太のEランク業務日
  scenes:

    - id: EP9S1
      time: 08:45
      label: 出社・ギア装着
      summary: >
        QR社屋に到着した奏太は控室へ。無言で支給されたニプチョコ・ピットスキン・ディグプラグを手に取り、天井カメラの監視下でひとつずつ装着。
        クラリオンキーはまだテーブルの上。女王様に視線が届いている前提で、口元を震わせながら最後の確認をする。
      emotion: 緊張と屈辱を噛み殺し、「選ばれた」ことに意義を見出そうとする
      tokens: [【E1】：装着時の羞恥と硬直]

    - id: EP9S2
      time: 09:30
      label: 羞恥ポーズ実演（プリケツスクリプター）
      summary: >
        ガラスケースに入室後、臀部アングルの指示に従って「文字列尻書き」を連続実施。姿勢がズレると自動的にお仕置き刺激が入る設定。
        20セットの文字列をこなし、途中で涙声になっても中断は許されない。
      emotion: 耐えがたい羞恥の中でも、カメラの向こうの「女王様」の視線に縋って耐える
      tokens: [【E2】：尻文字実演中の羞恥崩壊]

    - id: EP9S3
      time: 11:00
      label: クラリオンキー：台詞閾値判定
      summary: >
        クラリオンキーを装着し、難解で猥褻な営業文言を強制発話。失敗判定で羞恥振動が強化され、濡れ反応が蓄積されていく。
        本人の羞恥と機器の反応が乖離し始め、混乱しながらも繰り返す。
      emotion: 理解も反応もついていかず、嗚咽しながら読み続ける
      tokens: [【E3】：誤読による羞恥バイブ連打]

    - id: EP9S4
      time: 12:30
      label: ケース内休憩
      summary: >
        水分補給のみが許可された昼休憩。立ち姿のまま見世物のように晒され、社員見学者に囲まれる。
        プロトコル画面には「羞恥継続中：YES」のログが点灯し続ける。
      emotion: 精神的な限界を越えつつも、自分からギアを外そうとはしない
      tokens: [【E4】：羞恥定常状態の継続]

    - id: EP9S5
      time: 15:00
      label: 新ギアテスト（スリップウェッジβ）
      summary: >
        開発中の濡れ反応増幅ギアを試験的に装着。ピットスキンと併用された状態で営業スクリプトの朗読に挑むが、突発的な刺激に崩れる。
        震えながらの再開に対し、女王様端末から「採用」とのコメントがログに記録される。
      emotion: もう立てないほどの羞恥と苦痛の中、嬉しさすら感じ始める
      tokens: [【E5】：突発刺激による制御崩壊]

    - id: EP9S6
      time: 18:00
      label: 撤収・帰宅
      summary: >
        ギアを外しながらも手が震え、反応が抜けきらないままケースを出る。上司から「壊れるなよ」と冗談めかして皮肉られる。
        自宅への帰路、無言。
      emotion: 感情が抜け落ち、空っぽのまま帰る
      tokens: [【E6】：脱力と放心のまま帰宅]

    - id: EP9S7
      time: 20:30
      label: 帰宅後、懇願
      summary: >
        村井宅の風呂場から出たあと、ギアの痕が残る身体のまま膝をつき、「今日は使ってください…見られただけじゃ、だめだった…」と訴える。
        村井は黙って奏太を受け止める。
      emotion: 自我が崩れ落ちた先で、ただ一人を求める
      tokens: [【E7】：懇願と依存の発露]